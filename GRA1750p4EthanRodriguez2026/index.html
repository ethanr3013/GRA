		background-attachment: fixed;

    wrapper {

        margin: 15px 0;
        background-image: url(https://github.com/ethanr3013/GRA/blob/main/GRA1750p4EthanRodriguez2026/lasergif.gif?raw=true);
        background-clip: text;
        -webkit-background-clip: text;
        background-position: center;
        background-size: cover;
    }

    img {
        max-width: 100%;
        border-radius: 12px;
    }

    h3 {
        background-color: #f3efff;
        color: #554486;
        padding: 12px;
        margin: 12px 0;
        border-radius: 10px;
        font-size: 18px;
        font-weight: 600;
    }

    h4 {

        color: #7162a5;
